<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDoリスト</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
    background: #f0f2f5;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    padding: 30px 40px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #333;
    text-align: center;
  }

  .stats {
    margin: 0 0 20px;
    font-size: 13px;
    color: #999;
    text-align: center;
  }

  .input-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  #taskInput {
    flex: 1 1 120px;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid #dcdfe4;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  #taskInput:focus, #dueInput:focus {
    border-color: #6c8cff;
  }

  #dueInput {
    flex: 1 1 130px;
    min-width: 0;
    max-width: 150px;
    padding: 10px 10px;
    border: 1px solid #dcdfe4;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    color: #333;
    transition: border-color 0.2s;
  }

  #addBtn {
    flex: 0 0 auto;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #6c8cff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  #addBtn:hover {
    background: #5678e0;
  }

  #taskList {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  #taskList li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    margin-bottom: 8px;
    background: #f8f9fb;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }

  #taskList li:hover {
    background: #eef1f7;
  }

  #taskList li .task-main {
    flex: 1;
    min-width: 0;
  }

  #taskList li .task-text {
    word-break: break-all;
    color: #333;
    font-size: 15px;
  }

  #taskList li .task-due {
    margin-top: 4px;
    font-size: 12px;
    color: #999;
  }

  #taskList li .task-due.overdue {
    color: #ff6b6b;
    font-weight: bold;
  }

  #taskList li.completed .task-text {
    text-decoration: line-through;
    color: #999;
  }

  #taskList li .delete-btn {
    border: none;
    background: transparent;
    color: #ff6b6b;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    margin-left: 10px;
  }

  #taskList li .delete-btn:hover {
    background: #ffe3e3;
  }

  .empty-message {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 20px 0;
  }
</style>
</head>
<body>

  <div class="app">
    <h1>ToDoリスト</h1>
    <div class="stats" id="stats">0 / 0 件完了</div>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="タスクを入力…">
      <input type="date" id="dueInput">
      <button id="addBtn">追加</button>
    </div>
    <ul id="taskList"></ul>
  </div>

<script>
  let tasks = [];

  const taskInput = document.getElementById('taskInput');
  const dueInput = document.getElementById('dueInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const stats = document.getElementById('stats');

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;

    tasks.push({
      id: Date.now(),
      text: text,
      completed: false,
      dueDate: dueInput.value || null
    });

    taskInput.value = '';
    dueInput.value = '';
    render();
  }

  function formatDue(dueDate) {
    const [y, m, d] = dueDate.split('-');
    return `期限: ${y}/${m}/${d}`;
  }

  function isOverdue(task) {
    if (!task.dueDate || task.completed) return false;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return new Date(task.dueDate) < today;
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      render();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    render();
  }

  function render() {
    taskList.textContent = '';

    const completedCount = tasks.filter(t => t.completed).length;
    stats.textContent = `${completedCount} / ${tasks.length} 件完了`;

    if (tasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-message';
      empty.textContent = 'タスクがありません';
      empty.style.cursor = 'default';
      empty.style.background = 'transparent';
      taskList.appendChild(empty);
      return;
    }

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = task.completed ? 'completed' : '';
      li.addEventListener('click', () => toggleTask(task.id));

      const main = document.createElement('div');
      main.className = 'task-main';

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text;
      main.appendChild(span);

      if (task.dueDate) {
        const due = document.createElement('div');
        due.className = 'task-due' + (isOverdue(task) ? ' overdue' : '');
        due.textContent = formatDue(task.dueDate);
        main.appendChild(due);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task.id);
      });

      li.appendChild(main);
      li.appendChild(delBtn);
      taskList.appendChild(li);
    });
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>

</body>
</html>
