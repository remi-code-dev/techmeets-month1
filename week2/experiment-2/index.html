<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロフィール</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .card {
    width: 400px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    padding: 32px 24px;
    text-align: center;
  }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 16px;
  }

  .name {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 700;
    color: #222;
  }

  .comment {
    margin: 0 0 20px;
    font-size: 14px;
    color: #666;
  }

  .badges {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .badge {
    background: #eef0ff;
    color: #4f46e5;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://placehold.jp/100x100.png" alt="アイコン">
    <h1 class="name">Yukita Rui</h1>
    <p class="comment">ものづくりが好きなエンジニアです。</p>
    <div class="badges" id="badges"></div>
  </div>

  <script>
    const skills = ["JavaScript", "HTML", "CSS", "Python"];
    const badgesEl = document.getElementById("badges");

    skills.forEach((skill) => {
      const span = document.createElement("span");
      span.className = "badge";
      span.textContent = skill;
      badgesEl.appendChild(span);
    });
  </script>
</body>
</html>
