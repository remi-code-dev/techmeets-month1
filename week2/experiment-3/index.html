<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDoリスト</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
    background: #f0f2f5;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  }

  .app {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    padding: 36px 40px;
  }

  h1 {
    margin: 0 0 10px;
    font-size: 22px;
    color: #333;
    text-align: center;
    letter-spacing: 0.02em;
  }

  .stats {
    margin: 0 0 26px;
    font-size: 13px;
    color: #999;
    text-align: center;
  }

  .input-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  #taskInput {
    flex: 1 1 140px;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid #dcdfe4;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.2s;
  }

  #taskInput:focus, #dueInput:focus {
    border-color: #6c8cff;
  }

  #dueInput {
    flex: 1 1 140px;
    min-width: 0;
    max-width: 160px;
    padding: 11px 10px;
    border: 1px solid #dcdfe4;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    color: #333;
    transition: border-color 0.2s;
  }

  #addBtn {
    flex: 1 1 100%;
    padding: 11px 18px;
    border: none;
    border-radius: 8px;
    background: #6c8cff;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  #addBtn:hover {
    background: #5678e0;
  }

  #taskList {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  #taskList li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    margin-bottom: 10px;
    background: #f8f9fb;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
  }

  #taskList li:hover {
    background: #eef1f7;
  }

  #taskList li .task-main {
    flex: 1;
    min-width: 0;
  }

  #taskList li .task-text {
    word-break: break-all;
    color: #333;
    font-size: 15px;
    line-height: 1.5;
  }

  #taskList li .task-due {
    margin-top: 6px;
    font-size: 12px;
    color: #999;
  }

  #taskList li .task-due.overdue {
    color: #ff6b6b;
    font-weight: bold;
  }

  #taskList li.completed .task-text {
    text-decoration: line-through;
    color: #999;
  }

  #taskList li .delete-btn {
    flex: 0 0 auto;
    border: none;
    background: transparent;
    color: #ff6b6b;
    font-size: 13px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 6px;
    margin-left: 16px;
  }

  #taskList li .delete-btn:hover {
    background: #ffe3e3;
  }

  .empty-message {
    text-align: center;
    color: #aaa;
    font-size: 14px;
    padding: 20px 0;
  }

  .filter-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }

  .filter-btn {
    flex: 1;
    padding: 9px 0;
    border: 1px solid #dcdfe4;
    border-radius: 8px;
    background: #fff;
    color: #666;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }

  .filter-btn:hover {
    background: #eef1f7;
  }

  .filter-btn.active {
    background: #6c8cff;
    border-color: #6c8cff;
    color: #fff;
  }

  #searchInput {
    width: 100%;
    padding: 11px 14px;
    margin-bottom: 18px;
    border: 1px solid #dcdfe4;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  #searchInput:focus {
    border-color: #6c8cff;
  }
</style>
</head>
<body>

  <div class="app">
    <h1>ToDoリスト</h1>
    <div class="stats" id="stats">0 / 0 件完了</div>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="タスクを入力…">
      <input type="date" id="dueInput">
      <button id="addBtn">追加</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">すべて</button>
      <button class="filter-btn" data-filter="active">未完了のみ</button>
      <button class="filter-btn" data-filter="completed">完了済みのみ</button>
    </div>
    <input type="text" id="searchInput" placeholder="キーワードで検索…">
    <ul id="taskList"></ul>
  </div>

<script>
  const STORAGE_KEY = 'todo-tasks';

  function loadTasks() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  let tasks = loadTasks();
  let currentFilter = 'all';
  let searchKeyword = '';

  const taskInput = document.getElementById('taskInput');
  const dueInput = document.getElementById('dueInput');
  const addBtn = document.getElementById('addBtn');
  const taskList = document.getElementById('taskList');
  const stats = document.getElementById('stats');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const searchInput = document.getElementById('searchInput');

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) return;

    tasks.push({
      id: Date.now(),
      text: text,
      completed: false,
      dueDate: dueInput.value || null
    });

    taskInput.value = '';
    dueInput.value = '';
    saveTasks();
    render();
  }

  function formatDue(dueDate) {
    const [y, m, d] = dueDate.split('-');
    return `期限: ${y}/${m}/${d}`;
  }

  function isOverdue(task) {
    if (!task.dueDate || task.completed) return false;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return new Date(task.dueDate) < today;
  }

  function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      saveTasks();
      render();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks();
    render();
  }

  function render() {
    taskList.textContent = '';

    const completedCount = tasks.filter(t => t.completed).length;
    stats.textContent = `${completedCount} / ${tasks.length} 件完了`;

    const filteredTasks = tasks.filter(task => {
      if (currentFilter === 'active' && task.completed) return false;
      if (currentFilter === 'completed' && !task.completed) return false;
      if (searchKeyword && !task.text.toLowerCase().includes(searchKeyword)) return false;
      return true;
    });

    if (filteredTasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-message';
      empty.textContent = tasks.length === 0 ? 'タスクがありません' : '該当するタスクがありません';
      empty.style.cursor = 'default';
      empty.style.background = 'transparent';
      taskList.appendChild(empty);
      return;
    }

    filteredTasks.forEach(task => {
      const li = document.createElement('li');
      li.className = task.completed ? 'completed' : '';
      li.addEventListener('click', () => toggleTask(task.id));

      const main = document.createElement('div');
      main.className = 'task-main';

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text;
      main.appendChild(span);

      if (task.dueDate) {
        const due = document.createElement('div');
        due.className = 'task-due' + (isOverdue(task) ? ' overdue' : '');
        due.textContent = formatDue(task.dueDate);
        main.appendChild(due);
      }

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = '削除';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task.id);
      });

      li.appendChild(main);
      li.appendChild(delBtn);
      taskList.appendChild(li);
    });
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  searchInput.addEventListener('input', () => {
    searchKeyword = searchInput.value.trim().toLowerCase();
    render();
  });

  render();
</script>

</body>
</html>
